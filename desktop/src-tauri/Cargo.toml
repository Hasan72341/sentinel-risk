[package]
name = "sentinel-risk-desktop"
version = "0.6.0"
description = "Sentinel Risk - Professional Financial Statement Analysis Desktop App"
authors = ["Sentinel Risk LLC"]
edition = "2021"

[lib]
name = "sentinel_risk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
